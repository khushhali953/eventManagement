<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register • Eventify</title>

  <!-- ✅ FIXED SCRIPT -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
      padding: 32px 28px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="flex justify-center mb-6">
      <div class="flex items-center gap-3">

        <div style="width:50px;height:50px;overflow:hidden;border-radius:12px;">
          <img src="https://res.cloudinary.com/dk11fuqgz/image/upload/v1776185317/Screenshot_2026-04-14_221812_huwlhg.png"
               style="width:100%; height:100%; object-fit:cover; display:block;">
        </div>

        <span class="text-2xl font-bold text-gray-900">
          Eventify
        </span>

      </div>
    </div>

    <!-- TITLE -->
    <h1 class="text-xl font-semibold text-center text-gray-900 mb-6">
      Create Account
    </h1>

    <!-- FORM -->
    <form action="/auth/register" method="POST" class="space-y-4">

      <input 
        type="text" 
        name="username" 
        placeholder="Username" 
        required
        class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500">

      <input 
        type="email" 
        name="email" 
        placeholder="Email" 
        required
        class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500">

      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        required
        class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500">

      <button 
        type="submit"
        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-3 rounded-xl text-base hover:brightness-105 transition-all">
        Register
      </button>
    </form>

    <!-- LOGIN LINK -->
    <div class="text-center mt-6 text-sm text-gray-600">
      Already have an account? 
      <a href="/login.html" class="font-medium text-indigo-600 hover:text-indigo-700">
        Login
      </a>
    </div>

  </div>

</body>
</html>
