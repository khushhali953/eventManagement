<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Events • Eventify</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .card {
      transition: 0.3s;
      background: white;
      border-radius: 20px;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .card img {
      transition: 0.4s;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .filter-btn {
      border: 1px solid #e5e7eb;
      transition: 0.3s;
    }

    .filter-btn:hover {
      background: #eef2ff;
    }

    .active-filter {
      background: #4f46e5;
      color: white;
      border: none;
    }
     .footer {
  background: #1e293b;
  color: white;
  padding: 30px 20px;
  margin-top: 40px;
}

.footer-container {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
}

.footer-left h3 {
  margin: 0;
}

.footer-left p {
  font-size: 14px;
  color: #cbd5e1;
}

.footer-links a {
  display: block;
  color: #cbd5e1;
  text-decoration: none;
  margin: 5px 0;
}

.footer-links a:hover {
  color: white;
}

.footer-social a {
  margin-right: 10px;
  font-size: 18px;
  text-decoration: none;
}

.footer-bottom {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: #94a3b8;
}
  </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

<!-- 🔥 HEADER -->
<header class="bg-white shadow-sm border-b sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">

    <div class="flex items-center gap-3">
      <img src="https://res.cloudinary.com/dk11fuqgz/image/upload/v1776185317/Screenshot_2026-04-14_221812_huwlhg.png"
           class="w-10 h-10 rounded-lg object-cover">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Eventify</h1>
        <p class="text-xs text-gray-500 -mt-1">Event Management</p>
      </div>
    </div>

    <nav class="hidden md:flex gap-8 text-sm font-medium">
      <a href="/userHome.html" class="text-indigo-600">Home</a>
      <!-- <a href="/my-events.html" class="text-gray-600 hover:text-gray-900">My Events</a> -->
    </nav>

    <button onclick="logout()" 
      class="bg-red-50 hover:bg-red-100 text-red-600 px-5 py-2.5 rounded-2xl text-sm font-semibold flex items-center gap-2">
      <i class="fas fa-sign-out-alt"></i>
      Logout
    </button>

  </div>
</header>

<!-- 🔥 MAIN CONTENT -->
<div class="flex-1 p-8">

  <h1 class="text-3xl font-bold">All Events</h1>
  <p class="text-gray-500 mb-6">Register your events</p>

  <!-- 🔥 FILTER -->
  <div class="flex flex-wrap gap-3 mb-8">

    <button onclick="filterEvents('all')" id="filter-all"
      class="filter-btn active-filter px-5 py-2 rounded-xl">
      All Events
    </button>

    <button onclick="filterEvents('college')" id="filter-college"
      class="filter-btn px-5 py-2 rounded-xl">
      College
    </button>

    <button onclick="filterEvents('music')" id="filter-music"
      class="filter-btn px-5 py-2 rounded-xl">
      Music
    </button>

    <button onclick="filterEvents('tech')" id="filter-tech"
      class="filter-btn px-5 py-2 rounded-xl">
      Tech
    </button>

    <button onclick="filterEvents('night')" id="filter-night"
      class="filter-btn px-5 py-2 rounded-xl">
      Night Party
    </button>

    <button onclick="filterEvents('sports')" id="filter-sports"
      class="filter-btn px-5 py-2 rounded-xl">
      Sports
    </button>

  </div>

  <!-- 🔥 EVENTS -->
  <div id="events" class="grid md:grid-cols-3 gap-8"></div>

</div>

<!-- 🔥 FOOTER -->
 <footer class="footer">
  <div class="footer-container">

    <div class="footer-left">
      <h3>Event Manager</h3>
      <p>Discover, create and manage amazing events </p>
    </div>

    <div class="footer-links">
      <a href="/home.html">Home</a>
      <a href="/events.html">Events</a>
      <a href="/create-event.html">Create Event</a>
    </div>

    <div class="footer-social">
      <span>Follow:</span>
      <a href="#">🌐</a>
      <a href="#">📸</a>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 Event Manager | Made by KHUSHHALI
  </div>
</footer> 

<!-- 🔥 SCRIPT -->
<script>

let allEvents = [];

async function loadEvents() {
  const res = await fetch("/events");
  allEvents = await res.json();
  renderEvents(allEvents);
}

function renderEvents(events) {
  const container = document.getElementById("events");
  container.innerHTML = "";

  events.forEach(event => {
    container.innerHTML += `
      <div class="card">

        <div class="relative">
          <img src="${event.image || 'https://picsum.photos/400'}"
               class="w-full h-48 object-cover">

          <div class="absolute top-3 right-3 bg-white px-3 py-1 rounded-xl text-sm">
            ${event.type}
          </div>
        </div>

        <div class="p-5">
          <h3 class="text-lg font-bold">${event.title}</h3>

          <p class="text-sm text-gray-500 mb-2">
            <i class="fas fa-calendar"></i> ${event.date}
            &nbsp;
            <i class="fas fa-map-marker-alt"></i> ${event.location}
          </p>

          <p class="text-sm text-gray-600 mb-4">
            ${event.description || "No description"}
          </p>

          <button onclick="registerEvent('${event._id}')"
            class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-xl">
            Register Event
          </button>

        </div>
      </div>
    `;
  });
}

function filterEvents(type) {
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("active-filter");
  });

  document.getElementById(`filter-${type}`).classList.add("active-filter");

  if (type === "all") {
    renderEvents(allEvents);
  } else {
    const filtered = allEvents.filter(e => e.type === type);
    renderEvents(filtered);
  }
}

async function registerEvent(id) {
  const res = await fetch("/registrations", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify({ eventId: id })
  });

  const data = await res.json();
  alert(data.message || "Registered Successfully!");
}

function logout() {
  fetch("/auth/logout").then(() => {
    window.location.href = "/login.html";
  });
}

loadEvents();

</script>

</body>
</html>
