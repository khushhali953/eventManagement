  <script>
    let allEvents = [];
    let registeredEvents=[];
    async function loadEvents() {
  try {
    const res = await fetch("/events");
    if (!res.ok) {
      throw new Error("API failed");
    }
    const data = await res.json(); 
    allEvents = data;
    renderEvents(allEvents);
  } catch (error) {
    console.error("❌ Failed to load events:", error);
  }
}

function renderEvents(events) {
    const container = document.getElementById("events");
    const emptyState = document.getElementById("empty-state");
    container.innerHTML = "";
    if (events.length === 0) {
        emptyState.classList.remove("hidden");
        return;
    }
    emptyState.classList.add("hidden");
    events.forEach(event => {
        const isRegistered = registeredEvents.includes(event._id);
        container.innerHTML += `
            <div class="event-card bg-white rounded-3xl overflow-hidden shadow-sm">
                <div class="relative">
                    <img src="${event.image || 'https://picsum.photos/600/400'}"
                         class="event-image w-full h-56 object-cover">
                    <div class="absolute top-4 right-4 bg-white px-4 py-1 text-xs font-semibold rounded-2xl shadow">
                        ${event.type ? event.type.charAt(0).toUpperCase() + event.type.slice(1) : "Event"}
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="font-semibold text-xl text-gray-900 mb-3 line-clamp-2">
                        ${event.title}
                    </h3>
                    <div class="flex items-center text-sm text-gray-500 mb-4 gap-4">
                        <div class="flex items-center gap-1">
                            <i class="fas fa-calendar"></i>
                            <span>${event.date}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <i class="fas fa-map-marker-alt"></i>
                            <span class="truncate">${event.location}</span>
                        </div>
                    </div>
                    <p class="text-gray-600 text-sm line-clamp-3 mb-6">
                        ${event.description || "No description provided."}
                    </p>
                    ${
                        isRegistered
                            ? `<button class="w-full bg-green-600 text-white font-medium py-3 rounded-2xl" disabled>Registered</button>`
                            : `<button
                                id="btn-${event._id}"
                                onclick="registerEvent('${event._id}')"
                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-2xl">
                                Register Now
                            </button>`
                    }
                </div>
            </div>
        `;
    });
}
    function filterEvents(type) {
  document.querySelectorAll('button[id^="filter-"]').forEach(btn => {
    btn.classList.remove('bg-indigo-600', 'text-white');
    btn.classList.add('border', 'border-gray-200');
  });

  if (type === 'all') {
    document.getElementById('filter-all').classList.add('bg-indigo-600', 'text-white');
    renderEvents(allEvents);
  } else {
    document.getElementById(`filter-${type}`).classList.add('bg-indigo-600', 'text-white');

    const filteredEvents = allEvents.filter(event =>
      event.type && event.type.toLowerCase() === type.toLowerCase()
    );
   console.log("jeb");
    renderEvents(filteredEvents);
  }
}

async function registerEvent(id) {

    const res = await fetch(`/registration/${id}/register`, {
        method: "POST",
        credentials: "include"
    });

    const data = await res.json();

    if (res.ok) {

        alert(data.message || "Registration Successful");

        registeredEvents.push(id);

        renderEvents(allEvents);
        console.log("Button clicked");

    } else {

         alert(data.message);
         console.log("Button clicked");

    }

}

async function loadRegisteredEvents() {

    try {

        const res = await fetch("/registration/my/events", {
            credentials: "include"
        });

        const data = await res.json();

        // If API returns event objects
        registeredEvents = data.map(event => event._id);

        console.log("Registered Events:", registeredEvents);

    } catch (err) {
        console.log(err);
    }

}
    window.onload = async ()=>{
       await loadRegisteredEvents();
    await loadEvents();
};
