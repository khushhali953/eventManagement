<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in • Eventify</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 380px;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <div class="login-card p-8 md:p-10">

    <div class="flex justify-center mb-8">
      <div class="flex items-center gap-3">

        <div style="width:50px;height:50px;overflow:hidden;border-radius:12px;">
          <img src="https://res.cloudinary.com/dk11fuqgz/image/upload/v1776185317/Screenshot_2026-04-14_221812_huwlhg.png"
               style="width:100%; height:100%; object-fit:cover; display:block;">
        </div>

        <span class="text-2xl font-bold text-gray-900">
          Eventify
        </span>

      </div>
    </div>

    <!-- TITLE -->
    <h1 class="text-2xl font-semibold text-center text-gray-900 mb-2">
      Welcome back
    </h1>
    <p class="text-center text-gray-500 mb-8">
      Sign in to continue
    </p>

    <!-- FORM -->
    <form action="/auth/login" method="POST" class="space-y-5">

      <input 
        type="email" 
        name="email" 
        placeholder="Email address" 
        required
        class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-500 transition-all">

      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        required
        class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-500 transition-all">

      <button 
        type="submit"
        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-3.5 rounded-2xl text-lg hover:brightness-105 transition-all">
        Sign In
      </button>
    </form>

    <!-- GOOGLE LOGIN  -->
    <div class="my-6">
      <a href="/auth/google"
         class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:border-gray-400 bg-white py-3.5 rounded-2xl font-medium text-gray-700 transition-all">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
             class="w-5 h-5">
        Continue with Google
      </a>
    </div>

    <!-- REGISTER -->
    <div class="text-center text-sm text-gray-600">
      Don't have an account? 
      <a href="/register.html" class="font-semibold text-indigo-600 hover:text-indigo-700">
        Sign up
      </a>
    </div>

  </div>

</body>
</html>
